name: Build & publish

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"
      - name: Set up uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          version: "0.10.12"
          enable-cache: true
          ignore-nothing-to-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock
      - name: Sync locked dependencies (dev + sqlite + loader + docs extras)
        run: |
          uv sync --locked --extra dev --extra sqlite --extra loader --extra docs
      - name: Canonical quality gate
        env:
          TYPUS_ELEVATION_TEST: "0"
        run: |
          make check-all

  build-and-publish:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write  # needed to upload release asset
      id-token: write  # for OIDC (if you prefer it)
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          version: "0.10.12"
          enable-cache: true
          ignore-nothing-to-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock

      - name: Verify release tag matches package version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          package_version="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          tag_version="${GITHUB_REF_NAME#v}"
          if [ "$tag_version" != "$package_version" ]; then
            echo "::error::Release tag $GITHUB_REF_NAME does not match pyproject.toml version $package_version"
            exit 1
          fi

      - name: Sync locked publish tools
        run: uv sync --locked --extra dev

      - name: Build distributions
        run: |
          uv build --clear
          uv run --locked --extra dev twine check dist/*

      - name: Verify built wheel in isolated core and services environments
        run: |
          wheel="$(find dist -maxdepth 1 -name '*.whl' -print -quit)"
          if [ -z "$wheel" ]; then
            echo "::error::uv build did not produce a wheel"
            exit 1
          fi

          core_env="$(mktemp -d)"
          services_env="$(mktemp -d)"
          trap 'rm -rf "$core_env" "$services_env"' EXIT

          uv venv "$core_env"
          uv pip install --python "$core_env/bin/python" "$wheel"
          expected_version="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          EXPECTED_VERSION="$expected_version" "$core_env/bin/python" - <<'PY'
          import importlib.util
          import os
          import sys
          from importlib.metadata import version

          import typus
          import typus.models.geometry
          from typus import union_xyxy

          assert version("polli-typus") == os.environ["EXPECTED_VERSION"]
          assert importlib.util.find_spec("sqlalchemy") is None
          assert importlib.util.find_spec("rapidfuzz") is None
          assert "sqlalchemy" not in sys.modules
          assert union_xyxy((0.0, 0.0, 1.0, 1.0), (2.0, 2.0, 3.0, 3.0)) == (
              0.0,
              0.0,
              3.0,
              3.0,
          )
          PY

          uv venv "$services_env"
          uv pip install --python "$services_env/bin/python" "${wheel}[services]"
          EXPECTED_VERSION="$expected_version" "$services_env/bin/python" - <<'PY'
          import os
          from importlib.metadata import version

          from typus import TaxonomyService
          from typus.services import SQLiteTaxonomyService

          assert version("polli-typus") == os.environ["EXPECTED_VERSION"]
          assert TaxonomyService is not None
          assert SQLiteTaxonomyService is not None
          PY

      - name: Publish to TestPyPI
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.TEST_PYPI_API_KEY }}
        run: uv run --locked --extra dev twine upload -r testpypi dist/*

      - name: Publish to PyPI
        if: startsWith(github.ref, 'refs/tags/v') && github.repository == 'polli-labs/typus'
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_KEY }}
        run: uv run --locked --extra dev twine upload dist/*

      - name: Upload wheel as GitHub release asset
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda # v3.0.0
        with:
          files: dist/*
